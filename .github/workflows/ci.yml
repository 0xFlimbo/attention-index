name: CI

# docs/ENGINEERING.md §10 — "install → validate:data → check:production-data
# → typecheck → lint → test → build" on `pull_request` and `push: main`. A
# PR with invalid production data must fail (docs/PRODUCT.md §12's launch
# gate: "no placeholder metrics in production").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads `packageManager` in package.json (pnpm@9.15.9) — one source of
      # truth for the pnpm version, matching how this repo is run locally
      # (docs/ENGINEERING.md §1: "enable it with corepack enable pnpm").
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate data
        run: pnpm validate:data

      - name: Check production data
        run: pnpm check:production-data

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The X API's OpenAPI spec is public and free, no authentication
      # required (verified 2026-09-23: HTTP 200, OpenAPI 3.0.0). Downloaded
      # fresh here, rather than trusting a dated local copy, so a field the
      # vendor silently renamed fails CI instead of going unnoticed — see
      # tests/api-field-validity.test.ts.
      - name: Download X API OpenAPI spec
        run: curl -fsSL --retry 3 https://api.x.com/2/openapi.json -o "$RUNNER_TEMP/x-openapi.json"

      - name: Test
        run: pnpm test
        env:
          X_OPENAPI_SPEC: ${{ runner.temp }}/x-openapi.json

      - name: Build
        run: pnpm build
